<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Hub · Mockup</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--wash:#f0efec;
  --brand:#e6485c;--s1:#e6485c;--s2:#6250d6;--s3:#1baf7a;--s4:#eda100;--s5:#008300;
  --st1:#f09aa6;--st2:#ec7284;--st3:#e6485c;--st4:#a52a3d;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--goodtext:#006300;--badtext:#b02a2a;
  --accent:#e6485c;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--wash:#262624;
  --s1:#e6485c;--s2:#9085e9;--s3:#199e70;--s4:#c98500;--s5:#008300;
  --st1:#9a4452;--st2:#bd4a5c;--st3:#e6485c;--st4:#f5a0ab;
  --goodtext:#0ca30c;--badtext:#e66767;--accent:#e6485c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.5;background:var(--page);color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:18px 12px;border-right:1px solid var(--border);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:12.5px}
.nav a:hover{background:var(--wash);color:var(--ink)}
.nav a.locked{color:var(--muted)}
.nav a svg{flex:none;opacity:.8}
.nav .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav a[aria-current=page]{background:var(--wash);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.sync{display:flex;align-items:center;gap:10px}
.sync .muted{text-align:right;line-height:1.3}
.btn svg{vertical-align:-2px;margin-right:6px}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn.primary:hover{background:var(--st4);filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.busy svg{animation:none}html{scroll-behavior:auto}}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs b{color:var(--ink2);font-weight:600}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
.page-h h2:focus{outline:none}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--border)}
.pager a{display:inline-flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--axis);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:190px}
.pager a:hover{background:var(--wash)}
.pager a small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.pager a.next{text-align:right;margin-left:auto}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:320px}
.toast.on{opacity:1;transform:none}
.main{padding:20px 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top-actions label{display:flex;gap:8px;align-items:center;color:var(--ink2)}
select,input[type=date]{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;min-height:32px}
.btn{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:32px}
.btn:hover{background:var(--wash)}
.btn.sm{padding:3px 10px;min-height:26px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 0 var(--border)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg>label,.fg>.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fg.dates{flex-direction:row;align-items:center;gap:6px;padding-bottom:0}
.seg{display:flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--axis);padding:6px 11px;cursor:pointer;min-height:32px;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--wash)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:600}
.fnote{font-size:11.5px;color:var(--muted);max-width:260px}
.banner{display:flex;gap:10px;align-items:center;background:var(--wash);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:18px;color:var(--ink2)}
.banner b{color:var(--ink)}
section.sec{margin-bottom:30px;scroll-margin-top:84px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:650}
.sec-h .num{color:var(--muted);font-weight:500;margin-right:6px}
details.info{font-size:12px;color:var(--ink2);max-width:520px}
details.info summary{cursor:pointer;color:var(--ink2);list-style:none;display:inline-flex;gap:6px;align-items:center;padding:2px 8px;border:1px solid var(--axis);border-radius:999px}
details.info summary::-webkit-details-marker{display:none}
details.info[open] summary{background:var(--wash)}
details.info p{margin-top:8px;padding:10px 12px;background:var(--wash);border-radius:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.card h3{font-size:13.5px;font-weight:620}
.muted{color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;width:14px;border-radius:2px;vertical-align:3px}
.tile .tl{font-size:12px;color:var(--ink2)}
.tile .tv{font-size:28px;font-weight:650;letter-spacing:-.01em;margin:2px 0}
.dl{font-size:12px;color:var(--muted);white-space:nowrap}
.dl.good{color:var(--goodtext)}.dl.bad{color:var(--badtext)}.dl.neu{color:var(--muted)}
.hero{font-size:56px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.thin{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin:10px 0 8px}
.thin span{display:block;height:100%;min-width:0}
.tall{display:flex;height:28px;gap:2px;margin:8px 0}
.tall span{display:flex;align-items:center;padding-left:8px;border-radius:4px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap}
.meter{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:9px 0}
.meter .trk{height:8px;border-radius:999px;background:color-mix(in srgb,var(--st3) 18%,var(--surface));overflow:hidden}
.meter .fil{height:100%;border-radius:999px;background:var(--st3)}
.meter .v{text-align:right;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tw{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--axis);padding:0;white-space:nowrap}
.tbl th button{background:none;border:0;padding:8px 10px;cursor:pointer;font-weight:600;color:var(--ink2);width:100%;text-align:inherit}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num button{text-align:right}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sub td{background:var(--wash)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--wash);color:var(--ink)}
.chip svg{flex:none}
.find{display:grid;gap:6px}
.find .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.find p{font-size:13.5px}
.ph{background:color-mix(in srgb,var(--s4) 22%,transparent);border:1px dashed var(--s4);border-radius:4px;padding:0 5px;color:var(--ink)}
.lock{display:flex;gap:14px;align-items:center;border:1px dashed var(--axis);border-radius:10px;padding:18px 20px;color:var(--ink2);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--axis) 25%,transparent) 10px 11px)}
.lock b{color:var(--ink)}
textarea{width:100%;min-height:150px;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:10px 12px;resize:vertical}
dl.defs{display:grid;grid-template-columns:200px 1fr;gap:8px 16px}
dl.defs dt{font-weight:600}
dl.defs dd{color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stats div{background:var(--wash);border-radius:8px;padding:10px 12px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11.5px;color:var(--ink2)}
svg text{font-family:inherit}
svg .ax{font-size:11px;fill:var(--muted)}
svg .lab{font-size:12px;fill:var(--ink2)}
svg .val{font-size:12px;fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .base{stroke:var(--axis);stroke-width:1}
svg .target{stroke:var(--ink2);stroke-width:1.5}
svg .tlab{font-size:11px;fill:var(--ink2)}
svg .xh{stroke:var(--axis);stroke-width:1}
.tip{position:fixed;z-index:50;pointer-events:none;display:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:12px;min-width:140px}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;margin-top:10px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g2{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.nav{position:sticky;top:0;z-index:20;height:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--border)}.brand{display:none}.nav nav{display:flex;gap:4px;overflow-x:auto}.nav .grp{display:none}.nav a{white-space:nowrap}.filters{position:static}.sync{width:100%;justify-content:space-between}.main{padding:14px}.meter{grid-template-columns:110px 1fr 40px}dl.defs{grid-template-columns:1fr}.g4,.g3{grid-template-columns:1fr}}

.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.big{border-top:4px solid var(--c,var(--brand));padding:18px 18px 14px}
.big .bv{font-size:52px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.big .bt{font-size:14px;font-weight:620;margin-top:8px;display:flex;align-items:center;gap:6px}
.big .bs{color:var(--ink2);font-size:12.5px;margin-top:2px}
.big .bf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:24px}
.big.sm{padding:14px 16px 12px}
.big.sm .bv{font-size:32px}
.big.sm .bt{font-size:13px}
.ti{width:16px;height:16px;border-radius:50%;border:1px solid var(--axis);background:var(--surface);color:var(--ink2);font-size:10px;font-weight:700;line-height:1;cursor:help;display:inline-grid;place-items:center;padding:0;flex:none}
.ti:hover,.ti:focus-visible{background:var(--wash);color:var(--ink)}
.attn{display:grid;gap:10px;margin-top:6px}
.attn div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.attn svg{margin-top:3px}
@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.g5{grid-template-columns:1fr}.big .bv{font-size:44px}}

.eco-s{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eco-q{flex:1 1 340px;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--axis);border-radius:10px;background:var(--surface);color:var(--ink)}
.eco-q:focus{outline:none;border-color:var(--brand)}
.eco-g{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.4fr);gap:14px;margin-top:14px;align-items:start}
.eco-l{display:grid;gap:8px;max-height:640px;overflow:auto;padding:2px}
.eco-i{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.eco-i:hover{background:var(--wash)}
.eco-i[aria-current=true]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.eco-i b{display:block;font-size:13.5px;margin-bottom:4px}
.eco-i .k{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--ink2);overflow-wrap:anywhere}
.pl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--axis);margin:0 4px 4px 0;background:var(--surface)}
.pl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.eco-d h2{font-size:19px;margin:0 0 6px}
.eco-d h4{margin:16px 0 6px;font-size:13px;letter-spacing:.02em;color:var(--ink2);text-transform:uppercase}
.eco-d ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow-wrap:anywhere}
.cp{display:inline-flex;gap:8px;align-items:center;background:var(--wash);border-radius:6px;padding:2px 4px 2px 8px;font:12.5px ui-monospace,Menlo,Consolas,monospace;margin:0 6px 4px 0}
.cp button{border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:5px;font-size:11px;padding:1px 7px;cursor:pointer}
.dep{display:flex;flex-wrap:wrap;gap:6px}
.dep button{border:1px solid var(--axis);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-align:left}
.dep button:hover{background:var(--wash)}
.imp{border:1px solid var(--s4);background:color-mix(in srgb,var(--s4) 10%,transparent);border-radius:10px;padding:12px 14px;margin-top:12px}
.imp h5{margin:0 0 6px;font-size:14px}
.imp label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 0}
.imp .pg{font-weight:650;margin-top:8px;font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em}

.crumb2{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px;letter-spacing:.01em}
.eco-i .tx{font-size:13px;margin:0 0 6px;color:var(--ink)}
mark{background:color-mix(in srgb,var(--s4) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.shot{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:10px;line-height:0;background:#fff}
.shot img{width:100%;height:auto;display:block;user-select:none}
.shot .bx{position:absolute;box-sizing:border-box;border-radius:4px}
.shot .bx.sel{border:3px solid #e00000;box-shadow:0 0 0 9999px rgba(0,0,0,.12);pointer-events:none}
.shot .bx.oth{border:1px dashed rgba(0,0,0,.35);cursor:pointer}
.shot .bx.oth:hover{border-color:#e00000;background:rgba(224,0,0,.08)}
.shot.draw{cursor:crosshair;touch-action:none}.shot.draw .bx.oth{pointer-events:none}
.noshot{display:grid;gap:4px;border:1px dashed var(--axis);border-radius:10px;padding:18px;text-align:center;font-size:13px;color:var(--ink2)}
.noshot b{color:var(--ink)}
.cur{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--brand);background:var(--wash);border-radius:0 8px 8px 0;font-size:15px}
.callout{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--s4) 14%,transparent);font-size:13px}

.eco-w{position:relative}
.eco-w .eco-s{flex-wrap:nowrap}

.eco-s[hidden]{display:none}

.eco-bar{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:8px 8px 8px 12px;min-height:62px}
.eco-bar:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.bsep{width:1px;height:24px;background:var(--axis);flex:none}
.eco-bar .eco-q{border:0;border-radius:0;background:transparent;flex:1 1 auto;min-width:0;padding:8px 4px;font-size:16px}
.eco-bar .eco-q:focus{outline:none}
.eco-q::-webkit-search-cancel-button{display:none}
.bclr{border:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;padding:0}
.bclr[hidden]{display:none}.bclr:hover{background:var(--wash)}
.bgo{border:0;border-radius:10px;width:46px;height:46px;background:#47ec84;color:#13233a;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.bgo:hover{background:#38d873}.bgo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sg{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 36px rgba(20,30,50,.16);max-height:460px;overflow:auto}
.sg[hidden]{display:none}
.sgh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.sgh b{font-weight:700;color:var(--ink)}.sgh span{color:var(--ink2)}
.sgi{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);font-size:15px;color:var(--ink2);cursor:pointer}
.sgi:last-child{border-bottom:0}
.sgi:hover,.sgi[aria-selected=true]{background:var(--wash)}
.sgo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--wash);color:var(--ink)}
.sgi:hover .sgo,.sgi[aria-selected=true] .sgo{background:var(--surface)}
.sgx{overflow-wrap:anywhere}.sgx b{color:var(--ink)}.sgx em{font-style:normal;font-size:12px;margin-left:6px}
.sgm{font-size:12.5px;white-space:nowrap}
.sgx .mono{font:13.5px ui-monospace,Menlo,Consolas,monospace}

<body>
<div class="app">
  <aside class="nav" aria-label="Secciones del Hub">
    <div class="brand"><span class="logo">CH</span><div><b>Content Hub</b><small>Mockup · datos de ejemplo</small></div></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1>Content Hub</h1>
        <p class="sub">Equipo de Contenido · tickets, SLAs e impacto en los objetivos</p>
      </div>
      <div class="top-actions">
        <div class="sync"><span class="muted" id="sync-txt"></span><button class="btn primary" id="sync" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M11.5 7a4.5 4.5 0 11-1.3-3.2M11.5 1.8v2.4H9.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Resincronizar con Jira</span></button></div>
        <label for="role">Ver como
          <select id="role"><option value="col">Colaborador</option><option value="lead" selected>Líder</option><option value="admin">Admin</option></select>
        </label>
        <button class="btn" id="theme" type="button">Modo oscuro</button>

      <div class="fg"><label for="f-type">Tipo de solicitud</label><select id="f-type"></select></div>
      <div class="fg" id="fg-presets"><span class="lbl">Rango de fechas</span><div class="seg" id="presets"></div></div>
      <div class="fg dates" id="fg-dates"><input type="date" id="f-from" aria-label="Desde"><span>–</span><input type="date" id="f-to" aria-label="Hasta"></div>
      <div class="fnote" id="fnote"></div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="content"></div>
    <footer>Mockup con datos de ejemplo generados al azar. No son tickets reales de Jira. Fecha de corte simulada: 10 nov 2026.</footer>
  </div>
</div>
<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- utilidades de fecha ---------- */
const MS=864e5,D0=Date.UTC(2026,0,1);
const iso=i=>new Date(D0+i*MS).toISOString().slice(0,10);
const idx=s=>Math.round((Date.parse(s+'T00:00:00Z')-D0)/MS);
const TODAY=idx('2026-11-10');
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD=i=>{const d=new Date(D0+i*MS);return d.getUTCDate()+' '+MES[d.getUTCMonth()]};
const fmtDY=i=>fmtD(i)+' '+new Date(D0+i*MS).getUTCFullYear();

/* ---------- catálogos ---------- */
const TARGET=90;
const TYPES=[
 {id:'landing',name:'Landing page',sla:7,col:'--s1',w:.22,titles:['Landing page refresh','New campaign landing','Hero copy update','Pricing page copy']},
 {id:'email',name:'Email',sla:3,col:'--s2',w:.20,titles:['Newsletter draft','Abandoned cart email','Welcome flow email','Promo email']},
 {id:'blog',name:'Blog / SEO',sla:10,col:'--s3',w:.17,titles:['SEO article','Destination guide','Blog refresh','Keyword cluster article']},
 {id:'app',name:'Contenido de app',sla:5,col:'--s4',w:.16,titles:['App perk copy','In-app banner copy','Onboarding screens copy','Push notification copy']},
 {id:'web',name:'Actualización web',sla:2,col:'--s5',w:.25,titles:['Homepage banner update','FAQ update','Footer links update','Typo fix on product page']}];
const STATUS=[{id:'todo',name:'Por hacer',col:'--st1'},{id:'doing',name:'En progreso',col:'--st2'},{id:'review',name:'En revisión',col:'--st3'},{id:'done',name:'Hecho',col:'--st4'}];
const OBJ=[
 {id:'T1',team:'Objetivo del equipo 1',mkt:'Objetivo de marketing 1',co:'Objetivo de compañía 1'},
 {id:'T2',team:'Objetivo del equipo 2',mkt:'Objetivo de marketing 1',co:'Objetivo de compañía 1'},
 {id:'T3',team:'Objetivo del equipo 3',mkt:'Objetivo de marketing 2',co:'Objetivo de compañía 2'}];
const typeById=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const statusById=Object.fromEntries(STATUS.map(t=>[t.id,t]));

/* ---------- datos de ejemplo (semilla fija) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(){
  const r=rng(20261110),out=[];let n=0;
  const pick=(arr,w)=>{let x=r()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){x-=w[i];if(x<0)return arr[i]}return arr[arr.length-1]};
  const pois=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L);return k-1};
  for(let i=0;i<=TODAY;i++){
    const dow=new Date(D0+i*MS).getUTCDay(),wk=dow>0&&dow<6,prog=i/TODAY;
    const k=pois(wk?1.0+0.9*prog:0.05);
    for(let j=0;j<k;j++){
      const ty=pick(TYPES,TYPES.map(t=>t.w));n++;
      const stalled=r()<0.03+0.07*prog;
      let cycle=null;
      if(!stalled){const f=1.18-0.28*prog;cycle=Math.max(1,Math.round(ty.sla*f*(0.35+r()*0.8+(r()<0.06?r()*1.5:0))))}
      const res=cycle==null?null:i+cycle,done=res!=null&&res<=TODAY;
      let st='done';
      if(!done){const age=TODAY-i,x=r();st=stalled?(x<.35?'doing':x<.7?'review':'todo'):(age<=2?(x<.5?'todo':'doing'):(x<.3?'todo':x<.75?'doing':'review'))}
      const objP=Math.max(.03,.30-.27*prog);
      const obj=r()>objP?pick(['T1','T2','T3'],[.38,.30,.32]):null;
      out.push({id:'SMP-'+(1000+n),type:ty.id,title:ty.titles[Math.floor(r()*ty.titles.length)],created:i,resolved:done?res:null,cycle:done?cycle:null,status:st,obj:obj,sla:ty.sla});
    }
  }
  return out;
}
const DATA=gen();

/* ---------- permisos (por sección y rol) ---------- */
const ROLES=[{id:'col',name:'Colaborador'},{id:'lead',name:'Líder'},{id:'admin',name:'Admin'}];
const SECTIONS=[
 {id:'exec',label:'Resumen ejecutivo',info:'Se genera con los datos del periodo filtrado y lo compara con el periodo anterior de igual duración. El semáforo usa la meta de SLA y la relación demanda/capacidad.'},
 {id:'summary',label:'Resumen de tickets',info:'Tickets creados dentro del rango de fechas y del tipo de solicitud elegido. "En curso" son los que hoy no están en Hecho. El cambio se compara con el periodo anterior de igual duración.'},
 {id:'eco',label:'Content Ecosystem',info:'Buscador de todo lo que se modifica en el sitio web, los emails y la app: en qué plataforma vive cada contenido, qué llave o campo hay que tocar y de qué otros contenidos depende. Los datos de esta maqueta son de ejemplo; en producción vienen de la base Content Ecosystem.'},
 {id:'work',label:'Tareas',info:'Todo el contexto del trabajo en una sola página: avance, cantidad por tipo de solicitud y estado actual en el tablero Kanban. Un solo filtro (tipo y fechas) afecta todos los gráficos. Completado = ticket en Hecho; el tiempo de ciclo solo considera tickets completados.'},
 {id:'sla',label:'SLAs',info:'Un ticket cumple el SLA si se resolvió dentro del tiempo objetivo de su tipo. Se evalúan los tickets resueltos y los abiertos que ya excedieron su tiempo. Periodos con menos de 3 tickets evaluables no se grafican.'},
 {id:'breach',label:'SLAs incumplidos',info:'Tickets resueltos tarde o que siguen abiertos y ya excedieron el tiempo objetivo de su tipo. Haz clic en un encabezado para ordenar.'},
 {id:'goals',label:'Objetivos e impacto',info:'Cada ticket se asocia a un objetivo del equipo, y cada objetivo del equipo a uno de marketing y uno de la compañía. El % del esfuerzo es la proporción de tickets por objetivo (fase 2: ponderar por tiempo activo).'},
 {id:'capacity',label:'Capacidad vs demanda',info:'Demanda: tickets creados por periodo. Capacidad: tickets completados por periodo (throughput real). Si la demanda supera a la capacidad de forma sostenida, el backlog crece.'},
 {id:'qoq',label:'Análisis trimestre a trimestre',info:'Compara cada trimestre del año con el anterior. El Q4 está en curso, por eso se comparan promedios por semana y no totales. No usa el filtro de fechas.'},
 {id:'learn',label:'Lo aprendido y foco del próximo Q',info:'Espacio editable para que los líderes dejen conclusiones del trimestre y las prioridades del siguiente.'},
 {id:'defs',label:'Definiciones y metodología',info:'Reglas con las que se calcula cada número del Hub.'},
 {id:'perms',label:'Permisos',info:'Define qué rol puede ver cada sección. Solo los administradores pueden cambiarlo.'}];
const DEF_PERMS={exec:[0,1,1],summary:[1,1,1],eco:[1,1,1],work:[1,1,1],sla:[1,1,1],breach:[0,1,1],goals:[1,1,1],capacity:[0,1,1],qoq:[0,1,1],learn:[0,1,1],defs:[1,1,1],perms:[0,0,1],sync:[0,1,1],ecoedit:[0,1,1]};
let PERMS={};
function resetPerms(){PERMS={};Object.keys(DEF_PERMS).forEach(k=>PERMS[k]=DEF_PERMS[k].slice())}
resetPerms();
const META={exec:['Resumen','full'],summary:['Resumen','full'],eco:['Content Ecosystem','none'],work:['Trabajo','full'],sla:['SLAs','full'],breach:['SLAs','full'],goals:['Impacto y planeación','full'],capacity:['Impacto y planeación','full'],qoq:['Impacto y planeación','type'],learn:['Impacto y planeación','none'],defs:['Ayuda y ajustes','none'],perms:['Ayuda y ajustes','none']};
SECTIONS.forEach(x=>{x.grp=META[x.id][0];x.flt=META[x.id][1]});
const SYNC={short:'hoy, 08:42'};
let CUR='exec';
const roleIdx=r=>ROLES.findIndex(x=>x.id===r);

/* ---------- estado y filtros ---------- */
const S={type:'all',preset:'90',from:iso(TODAY-89),to:iso(TODAY),role:'lead'};
const PRESETS=[{id:'30',label:'30 días'},{id:'90',label:'90 días'},{id:'q',label:'Este Q'},{id:'pq',label:'Q anterior'},{id:'y',label:'Año 2026'}];
function applyPreset(id){
  S.preset=id;let a=TODAY-89,b=TODAY;
  if(id==='30')a=TODAY-29;
  if(id==='q')a=idx('2026-10-01');
  if(id==='pq'){a=idx('2026-07-01');b=idx('2026-09-30')}
  if(id==='y')a=0;
  S.from=iso(a);S.to=iso(b);
}
const win=()=>[Math.max(0,idx(S.from)),Math.min(TODAY,idx(S.to))];
const okType=t=>S.type==='all'||t.type===S.type;
const F=()=>{const[a,b]=win();return DATA.filter(t=>t.created>=a&&t.created<=b&&okType(t))};
const FP=()=>{const[a,b]=win(),len=b-a+1;return DATA.filter(t=>t.created>=a-len&&t.created<=a-1&&okType(t))};

/* ---------- cálculos ---------- */
function slaState(t){if(t.resolved!=null)return(t.resolved-t.created)<=t.sla?'ok':'late';return(TODAY-t.created)>t.sla?'overdue':'pending'}
function stats(ts){
  const o={total:ts.length,done:0,open:0,ok:0,late:0,overdue:0,cyc:0,cn:0};
  ts.forEach(t=>{if(t.status==='done'){o.done++;o.cyc+=t.cycle;o.cn++}else o.open++;const s=slaState(t);if(s==='ok')o.ok++;else if(s==='late')o.late++;else if(s==='overdue')o.overdue++});
  o.eval=o.ok+o.late+o.overdue;o.comp=o.eval?o.ok/o.eval:null;o.pct=o.total?o.done/o.total:null;o.avgCyc=o.cn?o.cyc/o.cn:null;o.breached=o.late+o.overdue;
  return o;
}
function buckets(a,b){
  const out=[],days=b-a+1;
  if(days<=150){
    let s=a-((new Date(D0+a*MS).getUTCDay()+6)%7);
    for(;s<=b;s+=7){const s2=Math.max(s,a),e=Math.min(s+6,b);out.push({s:s2,e:e,label:fmtD(s2),full:fmtD(s2)+' – '+fmtD(e)})}
  }else{
    const d=new Date(D0+a*MS);let y=d.getUTCFullYear(),m=d.getUTCMonth();
    for(;;){
      const s=Math.max(a,(Date.UTC(y,m,1)-D0)/MS),e=Math.min(b,(Date.UTC(y,m+1,1)-D0)/MS-1);
      if(s>b)break;out.push({s:s,e:e,label:MES[m],full:MES[m]+' '+y});
      m++;if(m>11){m=0;y++}
    }
  }
  return out;
}
const QS=[{n:'Q1 2026',a:0,b:idx('2026-03-31')},{n:'Q2 2026',a:idx('2026-04-01'),b:idx('2026-06-30')},{n:'Q3 2026',a:idx('2026-07-01'),b:idx('2026-09-30')},{n:'Q4 2026 (en curso)',a:idx('2026-10-01'),b:TODAY}];
function qStats(q){
  const ts=DATA.filter(t=>t.created>=q.a&&t.created<=q.b&&okType(t)),weeks=(q.b-q.a+1)/7;
  const res=DATA.filter(t=>okType(t)&&t.resolved!=null&&t.resolved>=q.a&&t.resolved<=q.b).length;
  const doneInQ=ts.filter(t=>t.resolved!=null&&t.resolved<=q.b).length,st=stats(ts);
  const backlog=DATA.filter(t=>okType(t)&&t.created<=q.b&&(t.resolved==null||t.resolved>q.b)).length;
  return{q:q,created:ts.length,cw:ts.length/weeks,res:res,rw:res/weeks,pct:ts.length?doneInQ/ts.length:null,sla:st.comp,cyc:st.avgCyc,backlog:backlog};
}

/* ---------- helpers de formato ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lum(hex){hex=hex.replace('#','');const c=[0,2,4].map(i=>parseInt(hex.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const textOn=hex=>lum(hex)>.35?'#0b0b0b':'#ffffff';
const pc=v=>v==null?'—':Math.round(v*100)+'%';
const n1=v=>v==null?'—':(Math.round(v*10)/10).toLocaleString('es-CO');
const nn=v=>v.toLocaleString('es-CO');
const ph=t=>'<span class="ph">['+t+']</span>';
function dPP(cur,prev,upGood){
  if(cur==null||prev==null)return'<span class="dl">sin periodo previo</span>';
  const d=(cur-prev)*100,up=d>0.05,dn=d<-0.05,good=(up&&upGood)||(dn&&!upGood);
  const cls=(!up&&!dn)?'neu':good?'good':'bad',ar=up?'▲':dn?'▼':'■';
  return'<span class="dl '+cls+'">'+ar+' '+(d>0?'+':'')+d.toFixed(1)+' pp vs. periodo anterior</span>';
}
function dRel(cur,prev,upGood){
  if(!prev)return'<span class="dl">sin periodo previo</span>';
  const d=(cur-prev)/prev*100,up=d>0.5,dn=d<-0.5,good=(up&&upGood)||(dn&&!upGood);
  const cls=(!up&&!dn)?'neu':good?'good':'bad',ar=up?'▲':dn?'▼':'■';
  return'<span class="dl '+cls+'">'+ar+' '+(d>0?'+':'')+d.toFixed(0)+'% vs. periodo anterior</span>';
}
const ICON={
  ok:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="var(--good)"/><path d="M4 7.2l2 2 4-4.2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l6.2 11.2H.8z" fill="var(--warn)"/><path d="M7 5.2v3.2M7 10v.2" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/></svg>',
  bad:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="var(--crit)"/><path d="M4.6 4.6l4.8 4.8M9.4 4.6L4.6 9.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>'
};
const chip=(k,t)=>'<span class="chip">'+ICON[k]+t+'</span>';

/* ---------- tooltip ---------- */
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
const hideTip=()=>{tip.style.display='none'};

/* ---------- gráficos SVG ---------- */
function scaleTicks(max){const raw=max/4||1,p=Math.pow(10,Math.floor(Math.log10(raw))),s=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||p*10,top=Math.ceil(max/s)*s,t=[];for(let v=0;v<=top+1e-9;v+=s)t.push(+v.toFixed(6));return{top:top||1,t:t}}
function legendHTML(items){return'<div class="legend">'+items.map(i=>'<span><i class="'+(i.line?'ln':'')+'" style="background:var('+i.col+')"></i>'+i.name+'</span>').join('')+'</div>'}

function lineChart(el,o){
  const W=Math.max(320,el.clientWidth),H=o.h||250,m={l:44,r:18,t:12,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b,n=o.labels.length;
  const X=i=>m.l+(n===1?iw/2:iw*i/(n-1)),Y=v=>m.t+ih*(1-(v-o.lo)/(o.hi-o.lo));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+o.aria+'">';
  o.ticks.forEach(t=>{s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" class="grid"/><text x="'+(m.l-8)+'" y="'+(Y(t)+4)+'" class="ax" text-anchor="end">'+o.yfmt(t)+'</text>'});
  const step=Math.ceil(n/Math.max(2,Math.floor(iw/62)));
  o.labels.forEach((l,i)=>{if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H-9)+'" class="ax" text-anchor="middle">'+l+'</text>'});
  s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(o.lo)+'" y2="'+Y(o.lo)+'" class="base"/>';
  if(o.target!=null)s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(o.target)+'" y2="'+Y(o.target)+'" class="target"/><text x="'+(W-m.r)+'" y="'+(Y(o.target)-6)+'" class="tlab" text-anchor="end">'+o.targetLabel+'</text>';
  o.series.forEach(se=>{
    let d='',pen=false,last=-1;
    se.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;last=i});
    s+='<path d="'+d+'" fill="none" style="stroke:var('+se.col+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(last>=0)s+='<circle cx="'+X(last)+'" cy="'+Y(se.values[last])+'" r="4" style="fill:var('+se.col+');stroke:var(--surface)" stroke-width="2"/>';
  });
  s+='<line class="xh" y1="'+m.t+'" y2="'+(m.t+ih)+'" style="display:none"/>';
  o.series.forEach(se=>{s+='<circle class="hd" r="4.5" style="display:none;fill:var('+se.col+');stroke:var(--surface)" stroke-width="2"/>'});
  s+='<rect class="hit" x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
  el.innerHTML=s;
  const svg=el.firstChild,xh=svg.querySelector('.xh'),dots=svg.querySelectorAll('.hd'),hit=svg.querySelector('.hit');
  hit.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width);
    let i=n===1?0:Math.round((mx-m.l)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.style.display='';

function barPath(x,y,w,h,r){ // redondeo solo en el extremo de datos (derecha), base cuadrada
  if(w<=0)return'';r=Math.min(r,w,h/2);

}
function hBars(el,items,o){
  const W=Math.max(300,el.clientWidth),rowH=36,lw=Math.min(150,W*.4),pr=56,H=items.length*rowH+(o.target!=null?16:6),top=(o.target!=null?14:0);
  const max=o.max||Math.max.apply(null,items.map(i=>i.value).concat([1]));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+o.aria+'">';
  const track=W-lw-pr;
  if(o.target!=null){const tx=lw+track*o.target/max;s+='<line x1="'+tx+'" x2="'+tx+'" y1="10" y2="'+H+'" class="target"/><text x="'+tx+'" y="8" class="tlab" text-anchor="middle">Meta '+o.target+'%</text>'}
  items.forEach((it,k)=>{
    const y=k*rowH+3+top,bw=track*it.value/max,bt=18,by=y+(rowH-bt)/2;
    s+='<text x="0" y="'+(y+rowH/2+4)+'" class="lab">'+it.label+'</text>';
    s+='<path d="'+barPath(lw,by,bw,bt,4)+'" style="fill:var('+it.col+')"/>';
    s+='<text x="'+(lw+bw+8)+'" y="'+(y+rowH/2+4)+'" class="val">'+o.fmt(it.value)+'</text>';
    s+='<rect class="hit" data-k="'+k+'" x="0" y="'+y+'" width="'+W+'" height="'+rowH+'" fill="transparent"/>';
  });
  s+='</svg>';el.innerHTML=s;

    const it=items[+h.dataset.k];
    h.addEventListener('mousemove',e=>showTip(e,'<b>'+it.label+'</b><div><span>'+(o.tipName||'Valor')+'</span><span>'+o.fmt(it.value)+'</span></div>'+(it.tip||'')));

function stackedH(el,rows,o){
  const W=Math.max(320,el.clientWidth),rowH=42,lw=Math.min(150,W*.3),pr=56,H=rows.length*rowH+4,bt=26,track=W-lw-pr;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+o.aria+'">';
  rows.forEach((r,k)=>{
    const y=k*rowH+4,tot=r.parts.reduce((a,p)=>a+p.value,0);
    s+='<text x="0" y="'+(y+bt/2+4)+'" class="lab">'+r.label+'</text>';

    r.parts.forEach(p=>{
      if(!p.value||!tot)return;
      const w=track*p.value/tot,gw=Math.max(0,w-2),fill=cssv(p.col);
      s+='<rect x="'+x+'" y="'+y+'" width="'+gw+'" height="'+bt+'" rx="4" style="fill:var('+p.col+')"/>';

    s+='<rect class="hit" data-k="'+k+'" x="0" y="'+(y-3)+'" width="'+W+'" height="'+(rowH-2)+'" fill="transparent"/>';

}

function colsChart(el,o){

function table(el,cols,rows,o){
  o=o||{};let sk=o.sortKey||null,sd=o.sortDir||-1;
  function draw(){
    const data=rows.slice();
    if(sk){const c=cols.find(c=>c.k===sk);data.sort((a,b)=>{const x=c.v?c.v(a):a[sk],y=c.v?c.v(b):b[sk];return(x>y?1:x<y?-1:0)*sd})}
    el.innerHTML='<div class="tw"><table class="tbl"><thead><tr>'+cols.map(c=>'<th scope="col" class="'+(c.num?'num':'')+'"><button type="button" data-k="'+c.k+'">'+c.h+(sk===c.k?(sd>0?' ▲':' ▼'):'')+'</button></th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>'<td class="'+(c.num?'num':'')+'">'+c.f(r)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(o.foot?'<p class="muted" style="margin-top:8px">'+o.foot+'</p>':'');
    el.querySelectorAll('th button').forEach(b=>b.onclick=()=>{if(sk===b.dataset.k)sd=-sd;else{sk=b.dataset.k;sd=-1}draw()});
  }
  draw();
}

R.breach=function(b){
  const ts=F().filter(t=>{const s=slaState(t);return s==='late'||s==='overdue'}).map(t=>{const days=t.resolved!=null?t.resolved-t.created:TODAY-t.created;return Object.assign({},t,{days:days,exc:days-t.sla,state:t.resolved!=null?'late':'overdue'})});
  const open=ts.filter(t=>t.state==='overdue').length;
  b.innerHTML='<div class="grid g3" id="br-t"></div><div id="br-g" style="margin-top:14px"></div>';
  $('#br-t',b).innerHTML=tile('Tickets incumplidos',nn(ts.length),'<span class="dl">en el rango seleccionado</span>')+tile('Abiertos y vencidos',nn(open),open?chip('bad','Requieren acción'):chip('ok','Sin vencidos'))+tile('Resueltos tarde',nn(ts.length-open),'<span class="dl">ya cerrados fuera de SLA</span>');
  card($('#br-g',b),{title:'Detalle de SLAs incumplidos',sub:'Ordenado por días de exceso · muestra hasta 12',empty:!ts.length,draw:cv=>table(cv,[
    {k:'id',h:'Ticket',f:r=>r.id},{k:'type',h:'Tipo',f:r=>'<span class="sw" style="background:var('+typeById[r.type].col+')"></span>'+typeById[r.type].name,v:r=>typeById[r.type].name},
    {k:'title',h:'Título',f:r=>r.title},{k:'created',h:'Creado',f:r=>fmtD(r.created)},{k:'sla',h:'SLA',num:1,f:r=>r.sla+' d'},{k:'days',h:'Días reales',num:1,f:r=>r.days},{k:'exc',h:'Exceso',num:1,f:r=>'+'+r.exc+' d'},
    {k:'state',h:'Situación',f:r=>r.state==='overdue'?chip('bad','Abierto, vencido'):chip('warn','Resuelto tarde')}

R.goals=function(b){

  $('#gl-bar',b).innerHTML=coParts.map(p=>{const w=ts.length?p.n/ts.length*100:0,fill=cssv(p.col);return w>0?'<span style="width:calc('+w+'% - 2px);background:var('+p.col+');color:'+textOn(fill)+'" title="'+p.name+': '+p.n+'">'+(w>=9?Math.round(w)+'%':'')+'</span>':''}).join('');
  card($('#gl-t',b),{title:'Mapa de objetivos',sub:'Compañía → Marketing → Equipo de Contenido · '+ph('Reemplazar con los objetivos reales del trimestre'),draw:cv=>table(cv,[
    {k:'co',h:'Objetivo de compañía',f:r=>r.none?chip('warn','Sin objetivo asignado'):ph(r.o.co),v:r=>r.o.co},
    {k:'mkt',h:'Objetivo de marketing',f:r=>r.none?'<span class="muted">Dato faltante en Jira</span>':ph(r.o.mkt),v:r=>r.o.mkt},
    {k:'te',h:'Objetivo del equipo',f:r=>r.none?'<span class="muted">—</span>':ph(r.o.team),v:r=>r.o.team},
    {k:'n',h:'Tickets',num:1,f:r=>r.s.total,v:r=>r.s.total},
    {k:'e',h:'% del esfuerzo',num:1,f:r=>'<span style="display:inline-flex;align-items:center;gap:8px;justify-content:flex-end"><span style="display:inline-block;width:70px;height:8px;border-radius:999px;background:color-mix(in srgb,var(--st3) 18%,var(--surface))"><span style="display:block;height:100%;width:'+(r.s.total/ts.length*100)+'%;border-radius:999px;background:var(--st3)"></span></span>'+pc(r.s.total/ts.length)+'</span>',v:r=>r.s.total},
    {k:'p',h:'% hechos',num:1,f:r=>pc(r.s.pct),v:r=>r.s.pct||0}
  ],rows.concat([{o:{co:'',mkt:'',team:''},s:none,none:1}]))});

function weeklySeries(){
  const[a,z]=win(),bk=buckets(a,z);
  return{bk:bk,dem:bk.map(x=>DATA.filter(t=>okType(t)&&t.created>=x.s&&t.created<=x.e).length),cap:bk.map(x=>DATA.filter(t=>okType(t)&&t.resolved!=null&&t.resolved>=x.s&&t.resolved<=x.e).length)};
}
R.capacity=function(b){

  const openNow=DATA.filter(t=>okType(t)&&t.status!=='done').length,ratio=cap?dem/cap:null;

  card($('#cp-g',b),{title:'Tickets creados vs. completados',sub:'Por '+((z-a+1)>150?'mes':'semana')+' · Capacidad de referencia del equipo: '+ph('definir con el equipo, en tickets por semana'),legend:legendHTML([{name:'Demanda (creados)',col:'--s2',line:1},{name:'Capacidad (completados)',col:'--s1',line:1}]),

R.qoq=function(b){

    const u=d>0.05,w=d<-0.05,g=(u&&up)||(w&&!up);return' <span class="dl '+((!u&&!w)?'neu':g?'good':'bad')+'">'+(u?'▲':w?'▼':'■')+' '+txt+'</span>'};

  card(g,{title:'Indicadores clave',sub:'Cambio frente al trimestre anterior · *Q4 en curso',draw:cv=>{
    cv.innerHTML='<div class="tw"><table class="tbl"><thead><tr><th scope="col"><button type="button" style="cursor:default">Indicador</button></th>'+q.map(x=>'<th scope="col" class="num"><button type="button" style="cursor:default">'+x.q.n.replace(' (en curso)','*')+'</button></th>').join('')+'</tr></thead><tbody>'+M.map(m=>'<tr><td>'+m.h+'</td>'+q.map((s,i)=>'<td class="num">'+m.f(s)+(m.d&&i>0?'<br>'+m.d(s,q[i-1]):'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="muted" style="margin-top:8px">Las barras comparan promedios por semana porque el Q4 aún no termina.</p>';
  }});
};

    if(it.t==='frase'){commit(it.ph);return}
    if(it.t==='dym'){commit(it.fix);return}
    if(it.t==='ubic'){ES.cat=it.cat;ES.sec=it.sec||'all';fillSec();commit('');return}
    if(it.t==='campo'||it.t==='llave'){ES.cat='all';ES.sec='all';fillSec();ES.sel=it.id;ES.imp=false;ES.draw=false;commit(it.t==='llave'?it.key:ecoBy[it.id].label);return}
  };
  const syncClr=()=>{$('#eclrq',b).hidden=!q.value};
  q.oninput=()=>{closeCat();syncClr();ES.draft=q.value;SG.open=true;SG.act=-1;drawSug();if(!q.value.trim()&&ES.q){ES.q='';list()}};
  q.onfocus=()=>{closeCat();SG.open=true;drawSug()};
  q.onkeydown=ev=>{
    const all=SG.items.length+(norm(ES.draft).trim()?1:0);
    if(ev.key==='ArrowDown'){ev.preventDefault();if(!SG.open){SG.open=true}SG.act=(SG.act+1)%Math.max(all,1);drawSug()}
    else if(ev.key==='ArrowUp'){ev.preventDefault();SG.act=(SG.act-1+all)%Math.max(all,1);drawSug()}
    else if(ev.key==='Enter'){ev.preventDefault();const it=SG.open&&SG.act>=0?(SG.act<SG.items.length?SG.items[SG.act]:'all'):'all';choose(it)}
    else if(ev.key==='Escape'){ev.preventDefault();closeSug()}
  };
  $('#ew',b).addEventListener('focusout',()=>setTimeout(()=>{if(!$('#ew',b).contains(document.activeElement)){closeSug();closeCat()}},0));
  sg.onmousedown=ev=>ev.preventDefault();
  sg.onclick=ev=>{const r=ev.target.closest('.sgi');if(!r)return;const i=r.dataset.i;choose(i==='all'?'all':SG.items[+i])};
  $('#ego',b).onclick=()=>commit(q.value);
  /* detalle */
  const boxHTML=(e,s)=>{
    const im=IMGS[s.img];
    if(!im)return'<div class="noshot"><b>Sin captura de esta sección</b><span>Sube una captura a la entrada y marca el campo con un recuadro rojo para confirmar visualmente qué texto se cambia.</span></div>';
    const bx=(f,cls)=>f.box?'<div class="'+cls+'" '+(cls==='bx oth'?'data-go="'+f.id+'" title="'+esc(f.label)+'" ':'')+'style="left:'+(f.box[0]/im.w*100)+'%;top:'+(f.box[1]/im.h*100)+'%;width:'+(f.box[2]/im.w*100)+'%;height:'+(f.box[3]/im.h*100)+'%"></div>':'';
    return'<div class="shot'+(ES.draw?' draw':'')+'" id="shot"><img src="'+im.src+'" alt="'+esc(im.alt)+'" draggable="false">'+ECO.filter(f=>f.s===e.s&&f.id!==e.id).map(f=>bx(f,'bx oth')).join('')+bx(e,'bx sel')+'</div>'
     +'<p class="muted" style="margin:6px 0 0;font-size:12.5px">'+(ES.draw?'Arrastra sobre la imagen para dibujar el recuadro del campo.':'El recuadro rojo marca el campo. La captura puede mostrar un texto distinto al actual: guíate por el recuadro y por la llave.')+'</p>';
  };
  const detail=e=>{
    const d=$('#edet',b);
    if(!e){d.innerHTML='<p class="muted">Selecciona un campo para ver dónde se edita.</p>';return}
    const s=secBy[e.s],imp=ecoImpact(e.id),canEdit=allowed('ecoedit'),sib=ECO.filter(f=>f.s===e.s&&f.id!==e.id);
    const grp={};imp.forEach(x=>{const a=fCat(x);(grp[a]=grp[a]||[]).push(x)});
    d.innerHTML='<div class="crumb2">'+s.cat+' › '+s.page+' › '+s.sec+'</div><h2>'+hx(e.label)+'</h2><div>'+platChip(fPl(e))+chip(ST[e.st].k,ST[e.st].n)+(s.tr!=='—'?'<span class="pl">Traducción: '+s.tr+'</span>':'')+'</div>'
     +'<h4>Así se ve</h4>'+boxHTML(e,s)
     +'<blockquote class="cur"><span class="muted">Texto actual</span><br>'+hx(e.text)+'</blockquote>'+(e.note?'<p class="callout">'+hx(e.note)+'</p>':'')
     +'<h4>Dónde se edita</h4><dl class="kv"><dt>Plataforma</dt><dd>'+s.proj+'</dd><dt>Entrada</dt><dd>'+s.entry+'</dd><dt>Llave o campo</dt><dd><span class="cp">'+hx(e.key)+'<button type="button" data-cp="'+esc(e.key)+'">Copiar</button></span></dd><dt>Responsable</dt><dd>'+s.own+'</dd><dt>Última verificación</dt><dd>'+e.ver+'</dd></dl>'
     +'<h4>Cómo actualizarlo</h4><ol>'+ecoSteps(e).map(x=>'<li>'+hx(x)+'</li>').join('')+'</ol>'
     +'<h4>Depende de</h4><div class="dep">'+(e.deps.length?e.deps.map(i=>'<button type="button" data-go="'+i+'">'+hx(ecoBy[i].label)+' · '+PLAT[fPl(ecoBy[i])].n+'</button>').join(''):'<span class="muted">No depende de otros contenidos.</span>')+'</div>'
     +'<h4>Se usa en</h4><div class="dep">'+(e.used.length?e.used.map(i=>'<button type="button" data-go="'+i+'">'+hx(ecoBy[i].label)+' · '+fCat(ecoBy[i])+'</button>').join(''):'<span class="muted">Ningún otro contenido depende de este.</span>')+'</div>'
     +(sib.length?'<h4>Otros campos de esta sección</h4><div class="dep">'+sib.map(f=>'<button type="button" data-go="'+f.id+'">'+hx(f.label)+'</button>').join('')+'</div>':'')
     +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" type="button" id="eimp">'+(ES.imp?'Ocultar impacto':'Voy a cambiar esto: ver impacto')+'</button><button class="btn" type="button" id="erep">Reportar desactualizado</button><button class="btn" type="button" id="eedit"'+(canEdit?'':' disabled title="Tu rol no puede editar entradas"')+'>Editar entrada</button>'+(IMGS[s.img]?'<button class="btn" type="button" id="edraw"'+(canEdit?'':' disabled title="Tu rol no puede editar entradas"')+'>'+(ES.draw?'Cancelar dibujo':'Redibujar recuadro')+'</button>':'')+'</div>'
     +(ES.imp?'<div class="imp"><h5>Checklist de impacto ('+imp.length+' contenidos)</h5>'+(imp.length?Object.keys(grp).map(k=>'<div class="pg">'+k+'</div>'+grp[k].map(x=>'<label><input type="checkbox"><span><b>'+hx(x.label)+'</b> · '+PLAT[fPl(x)].n+' · '+hx(x.key)+'</span></label>').join('')).join('')+'<div style="margin-top:10px"><button class="btn sm" type="button" id="ecl">Copiar checklist</button></div>':'<p class="muted" style="margin:0">Cambiar esto no afecta a otros contenidos.</p>')+'</div>':'');
    const sh=$('#shot',d);
    if(sh&&ES.draw){
      const im=IMGS[s.img];let st=null,tmp=null;
      const pt=ev=>{const r=sh.getBoundingClientRect();return[Math.min(Math.max((ev.clientX-r.left)/r.width,0),1),Math.min(Math.max((ev.clientY-r.top)/r.height,0),1)]};
      sh.onpointerdown=ev=>{ev.preventDefault();sh.setPointerCapture(ev.pointerId);st=pt(ev);tmp=document.createElement('div');tmp.className='bx sel';sh.appendChild(tmp)};
      sh.onpointermove=ev=>{if(!st)return;const p=pt(ev);tmp.style.left=Math.min(st[0],p[0])*100+'%';tmp.style.top=Math.min(st[1],p[1])*100+'%';tmp.style.width=Math.abs(p[0]-st[0])*100+'%';tmp.style.height=Math.abs(p[1]-st[1])*100+'%'};
      sh.onpointerup=ev=>{if(!st)return;const p=pt(ev),w=Math.abs(p[0]-st[0]),h=Math.abs(p[1]-st[1]);
        if(w*im.w>12&&h*im.h>8){e.box=[Math.round(Math.min(st[0],p[0])*im.w),Math.round(Math.min(st[1],p[1])*im.h),Math.round(w*im.w),Math.round(h*im.h)];ES.draw=false;toast('Recuadro actualizado (simulado).')}
        st=null;detail(e)};
    }
  };
  const list=()=>{
    const r=match(),ts=toks(ES.q),hlT=ts.concat(ts.flatMap(t=>SYM[t]||[]));
    fillCat();
    $('#ecount',b).innerHTML='<span>Resultados'+(ES.cat!=='all'?' · '+hx(ES.cat):'')+'</span><span>'+r.length+' de '+ECO.length+' campos</span>';
    const alts=[...new Set(r.flatMap(x=>x.alt))];
    $('#enote',b).innerHTML=alts.length?'Incluye también resultados con equivalentes o con errores de escritura: '+alts.map(t=>'«'+hx(t)+'»'+(SYM[t]?' ≈ «'+hx(SYM[t][0])+'»':'')).join(', '):'';
    if(r.length&&!r.some(x=>x.e.id===ES.sel)){ES.sel=r[0].e.id;ES.imp=false;ES.draw=false}
    $('#elist',b).innerHTML=r.length?r.map(x=>{const e=x.e,s=secBy[e.s];return'<button type="button" class="eco-i" role="option" data-id="'+e.id+'" aria-current="'+(e.id===ES.sel)+'"><span class="crumb2">'+s.cat+' › '+s.sec+'</span><b>'+hx(e.label)+'</b><div class="tx">'+hl(e.text,hlT)+'</div>'+platChip(fPl(e))+chip(ST[e.st].k,ST[e.st].n)+'<div class="k">'+hl(e.key,hlT)+'</div></button>'}).join(''):'<div class="card empty">No hay resultados. Prueba con otra palabra, otra categoría o quita un filtro.</div>';
    detail(r.length?ecoBy[ES.sel]:null);
  };
  selSec.onchange=ev=>{ES.sec=ev.target.value;list()};
  selCat.onclick=()=>{CAT.open?closeCat():openCat()};
  selCat.onkeydown=ev=>{
    const o=catOpts();
    if(['ArrowDown','ArrowUp','Enter',' '].includes(ev.key)){
      ev.preventDefault();
      if(!CAT.open){openCat();return}
      if(ev.key==='ArrowDown')CAT.act=(CAT.act+1)%o.length;
      else if(ev.key==='ArrowUp')CAT.act=(CAT.act-1+o.length)%o.length;
      else{chooseCat(o[CAT.act].v);return}
      drawCat();
    }else if(ev.key==='Escape'&&CAT.open){ev.preventDefault();closeCat()}
  };
  catList.onmousedown=ev=>ev.preventDefault();
  catList.onclick=ev=>{const r=ev.target.closest('.sgi');if(r)chooseCat(r.dataset.v)};
  b.onclick=ev=>{
    const t=ev.target.closest('button,[data-go]');if(!t)return;
    if(t.id==='eclrq'){ES.q='';ES.draft='';q.value='';syncClr();closeSug();list();q.focus();return}
    if(t.id==='eclr'){ES.q='';ES.draft='';ES.cat=ES.sec='all';R.eco(b);return}
    if(t.classList.contains('eco-i')){ES.sel=t.dataset.id;ES.imp=false;ES.draw=false;list();return}
    if(t.dataset.go){ES.sel=t.dataset.go;ES.imp=false;ES.draw=false;if(!match().some(x=>x.e.id===ES.sel)){ES.q='';ES.draft='';ES.cat=ES.sec='all';R.eco(b)}else list();return}
    if(t.dataset.cp){try{navigator.clipboard.writeText(t.dataset.cp)}catch(e){}toast('Copiado: '+t.dataset.cp);return}
    if(t.id==='eimp'){ES.imp=!ES.imp;detail(ecoBy[ES.sel]);return}
    if(t.id==='edraw'&&!t.disabled){ES.draw=!ES.draw;detail(ecoBy[ES.sel]);return}
    if(t.id==='erep'){toast('Reporte enviado al responsable (simulado).');return}
    if(t.id==='eedit'&&!t.disabled){toast('Abriría la entrada en la base Content Ecosystem (simulado).');return}
    if(t.id==='ecl'){const e=ecoBy[ES.sel],txt='Checklist: cambio en "'+e.label+'"\n'+ecoImpact(e.id).map(x=>'- [ ] '+x.label+' ('+PLAT[fPl(x)].n+': '+x.key+')').join('\n');try{navigator.clipboard.writeText(txt)}catch(er){}toast('Checklist copiado.');return}
  };
  syncClr();
  list();
};

/* ---------- navegación por páginas ---------- */
function allowed(id){return!!PERMS[id][roleIdx(S.role)]}
let PAGE=null;
try{const h0=location.hash.replace(/^#\/?/,'');if(SECTIONS.some(x=>x.id===h0))PAGE=h0}catch(e){}
function route(){return SECTIONS.some(x=>x.id===PAGE)?PAGE:null}
function go(id){
  PAGE=id;
  try{if(location.hash!=='#/'+id)history.pushState(null,'','#/'+id)}catch(e){/* iframe aislado: se navega igual, sin tocar la URL */}
  render();
}
function fromUrl(){try{const h=location.hash.replace(/^#\/?/,'');if(SECTIONS.some(x=>x.id===h)){PAGE=h;render()}}catch(e){}}
function firstAllowed(){const x=SECTIONS.find(x=>allowed(x.id));return x?x.id:SECTIONS[0].id}
function nav(){
  let g='',h='';
  SECTIONS.forEach(x=>{
    if(x.grp!==g){g=x.grp;h+='<div class="grp">'+g+'</div>'}
    const ok=allowed(x.id);
    h+='<a href="#/'+x.id+'" class="'+(ok?'':'locked')+'"'+(x.id===CUR?' aria-current="page"':'')+'><span>'+x.label+'</span>'+(ok?'':ICON.lock)+'</a>';
  });
  const nv=$('#nav');nv.innerHTML=h;
  const cur=nv.querySelector('[aria-current]');
  if(cur&&nv.scrollWidth>nv.clientWidth)nv.scrollLeft=cur.offsetLeft-nv.clientWidth/2+cur.offsetWidth/2;
}
function banner(){
  const r=ROLES[roleIdx(S.role)],n=SECTIONS.filter(x=>allowed(x.id)).length;
  $('#banner').innerHTML='<b>Vista simulada: '+r.name+'</b><span>· Accede a '+n+' de '+SECTIONS.length+' páginas. Las páginas con candado están reservadas a otros roles.</span>';

function syncUI(){
  const b=$('#sync'),ok=allowed('sync');
  $('#sync-txt').innerHTML='Última sincronización<br>'+SYNC.short+' (simulada)';

  hideTip();

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').slice(2))});
const tipHtml=t=>'<div style="width:230px;white-space:normal">'+t+'</div>';
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(e,tipHtml(t.dataset.tip))});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))hideTip()});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){const r=t.getBoundingClientRect();showTip({clientX:r.left,clientY:r.bottom-8},tipHtml(t.dataset.tip))}});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))hideTip()});
addEventListener('popstate',fromUrl);addEventListener('hashchange',fromUrl);
$('#sync').onclick=()=>{
  if(syncing||!allowed('sync'))return;
  syncing=true;const b=$('#sync'),lab=b.querySelector('span');
  b.classList.add('busy');b.disabled=true;lab.textContent='Sincronizando…';
  setTimeout(()=>{
    syncing=false;const d=new Date();
    SYNC.short='hoy, '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    b.classList.remove('busy');lab.textContent='Resincronizar con Jira';
    render(true);toast('Sincronización simulada: '+DATA.length+' tickets leídos de Jira.');
  },1600);
};
lastW=innerWidth;applyPreset('90');syncFilters();render();
window.__hub={S:S,render:render,applyPreset:applyPreset,syncFilters:syncFilters,setTheme:setTheme};
})();
</script>
