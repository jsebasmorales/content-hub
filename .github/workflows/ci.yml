# CI pipeline (SDD §13): install → lint → astro check → dependency-cruiser → unit →
# integration → build → e2e → security. Lighthouse and image publishing join in later phases
# (docs/DECISIONES.md D-008).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so tooling that loads configuration can run. No real secrets in CI.
  DATABASE_URL: pglite:memory
  SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  ALLOWED_EMAIL_DOMAIN: holafly.com
  BOOTSTRAP_LEADER_EMAIL: lider@holafly.com
  PUBLIC_APP_URL: http://localhost:4321
  AUTH_PROVIDER: local

jobs:
  quality:
    name: Lint, types, architecture, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check (astro check)
        run: pnpm check

      - name: Architecture rules (dependency-cruiser)
        run: pnpm arch

      - name: Unit tests with domain coverage gate (>= 90 %)
        run: pnpm test:coverage

      - name: Integration tests (embedded Postgres)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  security:
    name: Security (secrets and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked secrets in past commits are found too (SDD §11.3).
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level=high
