# CI pipeline (SDD §13): install → lint → astro check → dependency-cruiser → unit →
# integration → build → e2e → performance (Lighthouse + JS budget) → security. Image publishing
# joins in a later phase (docs/DECISIONES.md D-008, D-065).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so tooling that loads configuration can run. No real secrets in CI.
  DATABASE_URL: pglite:memory
  SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  ALLOWED_EMAIL_DOMAIN: holafly.com
  BOOTSTRAP_LEADER_EMAIL: lider@holafly.com
  PUBLIC_APP_URL: http://localhost:4321
  AUTH_PROVIDER: local
  JIRA_BASE_URL: https://ci-placeholder.atlassian.net
  JIRA_EMAIL: ci@holafly.com
  JIRA_API_TOKEN: ci-placeholder-token
  JIRA_PROJECT_KEY: JSMCO
  SYNC_TRIGGER_SECRET: ci-only-sync-secret-ci-only-sync-secret

jobs:
  quality:
    name: Lint, types, architecture, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check (astro check)
        run: pnpm check

      - name: Architecture rules (dependency-cruiser)
        run: pnpm arch

      - name: Design gate (no literal colors, radii or shadows; WCAG contrast of the tokens)
        run: pnpm check:design

      - name: Unit tests with domain coverage gate (>= 90 %)
        run: pnpm test:coverage

      - name: Integration tests (embedded Postgres)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  postgres:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same suites as the embedded database, but through the `pg` driver and real connections,
    # which is where concurrency bugs show up (docs/DECISIONES.md D-006, D-031).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests against Postgres
        run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-other-browsers:
    # Informational: it never blocks a merge (continue-on-error). It runs the filter's specs, the ones
    # with and without the script, in Firefox and WebKit; Chromium stays the blocking run above.
    name: Filter in Firefox and WebKit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Run the filter specs
        env:
          E2E_BROWSERS: all
        run: pnpm exec playwright test --project=firefox --project=webkit global-filter
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-other-browsers
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  performance:
    name: Performance (Lighthouse and JS budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    # SDD §12 / D-008: every page must stay inside the JS budget (30 KB gzip) and keep Lighthouse
    # scores, LCP and CLS within the limits in scripts/perf-check.mjs. Runs on the same embedded
    # database as the e2e tests, so pages are measured in their empty state.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the app
        run: |
          pnpm exec astro dev --port 4321 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/login > /dev/null && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Lighthouse and JS budget
        run: pnpm perf
      - name: Keep the app log when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-app-log
          path: app.log
          retention-days: 7

  security:
    name: Security (secrets and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so leaked secrets in past commits are found too (SDD §11.3).
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level=high
